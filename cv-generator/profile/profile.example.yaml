# ---------------------------------------------------------------------------
# YOUR FACTS DATABASE
# Copy this file to profile/profile.yaml (git-ignored) and replace everything with
# your real details. The generator will ONLY ever use what is written here.
#
# Tips
# - Put in MORE than fits on one CV: every role, every achievement, every tool.
#   The tailor picks the best subset for each job.
# - Every item needs a unique `id` (short, lowercase, no spaces).
# - Link bullets to skills (`skills: [...]`). That is what allows a bullet to be
#   reworded with the job ad's vocabulary (incl. skill aliases) - nothing else.
# - `aliases` = other names the SAME skill appears under in job ads
#   (e.g. "K8s" for Kubernetes). Only add true synonyms.
# - Dates: "YYYY-MM" or "YYYY". Leave `end` empty for your current job.
# All data below is a fictional example.
# ---------------------------------------------------------------------------

